name: whyblame protective-code check
description: >-
  Warns on a pull request when it removes or weakens protective code (raise, assert, early
  return checks, except/catch, locks, timeouts) whose history says it matters, and cites why.
author: Aniket Singh Kushwaha
branding:
  icon: shield
  color: blue

inputs:
  threshold:
    description: Report guards whose history score is at least this (0 to 1).
    required: false
    default: ""
  base:
    description: The revision the change starts from. Defaults to the pull request's base.
    required: false
    default: ""
  github-repo:
    description: >-
      The owner/name whose pull requests and issues the history links to. Defaults to this
      repository, or on a fork to the repository it was forked from.
    required: false
    default: ""
  python-version:
    description: Python used to run whyblame.
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v6
      with:
        python-version: ${{ inputs.python-version }}

    # The index lives in .git/provenance. Restoring it makes indexing incremental, so only
    # commits new since the last run are processed.
    - name: Restore the history index
      uses: actions/cache@v4
      with:
        path: .git/provenance
        key: whyblame-${{ runner.os }}-${{ github.sha }}
        restore-keys: whyblame-${{ runner.os }}-

    # A fork's history was discussed in the project it was forked from, so its links should
    # point there, not at the fork's own (unrelated) pull request numbers.
    - name: Name the repository the history links to
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPO_INPUT: ${{ inputs.github-repo }}
        IS_FORK: ${{ github.event.repository.fork }}
      run: |
        slug="$GITHUB_REPO_INPUT"
        if [ -z "$slug" ] && [ "$IS_FORK" = "true" ]; then
          slug="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent.full_name // empty' || true)"
        fi
        slug="${slug:-$GITHUB_REPOSITORY}"
        if [[ ! "$slug" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
          echo "::error::github-repo must look like owner/name"
          exit 1
        fi
        echo "Links point at $slug"
        echo "WHYBLAME_GITHUB_REPO=$slug" >> "$GITHUB_ENV"

    - name: Index history
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: uvx --from "$ACTION_PATH" whyblame index .

    # Inputs reach the script only as environment variables, never spliced into it, so a
    # crafted value can't inject shell code. The pull request's code is read as text, never run.
    - name: Check the change
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        THRESHOLD: ${{ inputs.threshold }}
      run: |
        if [ -z "$BASE" ]; then
          echo "::notice::No base revision (not a pull_request event?); nothing to check."
          exit 0
        fi
        args=(check . --base "$BASE" --head HEAD --format github)
        if [ -n "$THRESHOLD" ]; then args+=(--threshold "$THRESHOLD"); fi
        uvx --from "$ACTION_PATH" whyblame "${args[@]}"
