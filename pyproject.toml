[project]
name = "provenance"
version = "0.1.0"
description = "Find out why a line of code exists by mining repository history."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=3.0.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-c>=0.24",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-python>=0.25",
    "typer>=0.15",
]

[project.scripts]
provenance = "provenance.surfaces.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: calls a real external API"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
