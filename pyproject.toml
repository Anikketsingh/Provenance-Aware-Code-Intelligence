[project]
name = "whyblame"
version = "0.2.0"
description = "git blame tells you who. whyblame tells you why: trace any line past reformats to the change and ticket that explain it, for you and your AI agents (MCP)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aniket Singh Kushwaha" }, { name = "Aarish" }, { name = "Aftab" }]
keywords = ["git", "blame", "mcp", "code-history", "provenance", "ai-agents", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.0.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
    "starlette>=1.0",
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-c>=0.24",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-python>=0.25",
    "typer>=0.15",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Anikketsingh/Provenance-Aware-Code-Intelligence"
Repository = "https://github.com/Anikketsingh/Provenance-Aware-Code-Intelligence"
Issues = "https://github.com/Anikketsingh/Provenance-Aware-Code-Intelligence/issues"

[project.scripts]
whyblame = "provenance.surfaces.cli:app"
provenance = "provenance.surfaces.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]

# The published source package is the code only: never the reports, synopsis documents,
# evaluation data or anything else that happens to live in the repo.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live'"
markers = ["live: calls a real external API"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
